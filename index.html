    <section id="contact" class="contact">
        <div class="container">

                        <div class="contact-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            <span data-i18n="contact.location"></span>
                        </div>
                    </div>
                    
                    <div class="involvement-options">
                        <h4 data-i18n="contact.howto.title"></h4>
                        <ul>
                            <li data-i18n="contact.howto.partner"></li>
                            <li data-i18n="contact.howto.volunteer"></li>
                            <li data-i18n="contact.howto.support"></li>
                            <li data-i18n="contact.howto.student"></li>
                        </ul>
                    </div>
                </div>
                <div class="contact-form">
                    <form id="contactForm">
                        <div class="form-group">
                            <input type="text" id="name" data-i18n-placeholder="contact.form.name" placeholder="Votre nom" required>
                        </div>
                        <div class="form-group">
                            <input type="email" id="email" data-i18n-placeholder="contact.form.email" placeholder="Votre email" required>
                        </div>
                        <div class="form-group">
                            <select id="subject" required>
                                <option value="" data-i18n="contact.form.subject.default"></option>
                                <option value="contact" data-i18n="contact.form.subject.inquiry"></option>
                                <option value="partner" data-i18n="contact.form.subject.partner"></option>
                                <option value="volunteer" data-i18n="contact.form.subject.volunteer"></option>
                                <option value="support" data-i18n="contact.form.subject.support"></option>
                                <option value="student" data-i18n="contact.form.subject.student"></option>
                                <option value="other" data-i18n="contact.form.subject.other"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <textarea id="message" rows="5" data-i18n-placeholder="contact.form.message" placeholder="Votre message" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" data-i18n="contact.form.submit"></button>
                    </form>
                </div>
            </div>
        </div>
    </section>
